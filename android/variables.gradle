ext {
    // ═══════════════════════════════════════════════════════════════
    //  مستوى API 36 (Android 16) — مطلوب من Google Play بعد 31 أغسطس 2026
    //  minSdk يبقى 23 للحفاظ على أوسع دعم للأجهزة (Android 6.0+)
    // ═══════════════════════════════════════════════════════════════
    minSdkVersion = 23
    compileSdkVersion = 36
    targetSdkVersion = 36

    // إصدارات AndroidX المتوافقة مع compileSdk 36 (حسب توثيق Capacitor 8)
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    // ⚠️ لا ترفع هذا الرقم! cordova-android 13/14 يفرض minSdkVersion 24
    //    فيفشل دمج AndroidManifest مع minSdk = 23 (خطأ processReleaseMainManifest).
    //    10.1.1 هو الإصدار الرسمي المعتمد في قوالب Capacitor 4→8 كلها،
    //    ويدعم minSdk 22 فما فوق. المشروع لا يستخدم أي إضافة Cordova أصلاً،
    //    فهذه المكتبة مجرد تبعية داخلية لـ capacitor-android.
    cordovaAndroidVersion = '10.1.1'
}
