name: Build Decipher Tahiro (AAB + APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # ══ رقم البناء التلقائي — يزيد مع كل تشغيل فيمنع تكرار versionCode ══
    env:
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      # ── 1) Checkout ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2) Node.js ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3) Java 17 (required by Android Gradle Plugin 8.x) ──
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 4) Android SDK ──
      # لا نستعمل android-actions/setup-android@v3: فهو يحاول تثبيت حزمة
      # «tools» القديمة، وقد حُذفت من مستودع Google، فيرجع sdkmanager
      # بالرمز 1 وتفشل الخطوة قبل أن يصل البناء إلى الكود أصلاً:
      #   Warning: Failed to find package 'tools'
      #   Error: The process '.../sdkmanager' failed with exit code 1
      # الـ runner يحمل Android SDK مثبَّتاً مسبقاً، فنستعمله مباشرةً
      # ونثبّت ما نحتاجه فقط.
      - name: Setup Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          [ -d "$SDK" ] || { echo "::error::لم أجد Android SDK في $SDK"; exit 1; }

          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            # sort -V ترتيب إصدارات، لا أبجدي: وإلّا اختِير 9.0 على 16.0
            SDKMGR="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V -r | head -1)"
          fi
          [ -x "$SDKMGR" ] || { echo "::error::لم أجد sdkmanager داخل $SDK"; exit 1; }
          echo "sdkmanager: $SDKMGR"

          # قبول التراخيص — yes تمنع التعليق بانتظار إدخال،
          # و || true لأنّ sdkmanager يرجع رمزاً غير صفري أحياناً بعد القبول
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true

          # نثبّت ما يلزم compileSdk 36 فقط — ولا نقترب من حزمة tools
          "$SDKMGR" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0"

          echo "ANDROID_HOME=$SDK"     >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools"   >> "$GITHUB_PATH"
          echo "✅ Android SDK جاهز"

      # ── 5) Install JS dependencies ──
      - name: Install dependencies
        run: npm install

      # ── 6) Capacitor sync (copies www/ + plugins into android/) ──
      - name: Capacitor sync
        run: npx cap sync android

      # ── 6.5) اطبع رقم الإصدار المحسوب (للرفع على Play Console) ──
      - name: Show version code
        run: |
          BASE=$(grep -oP 'def VERSION_CODE_BASE = \K[0-9]+' android/app/build.gradle)
          VC=$((BASE + BUILD_NUMBER))
          echo "════════════════════════════════════════"
          echo "  versionCode = $VC   (base=$BASE + run=$BUILD_NUMBER)"
          echo "  versionName = 5.0.$VC"
          echo "════════════════════════════════════════"
          echo "### 📦 رقم الإصدار: \`$VC\` — الاسم: \`5.0.$VC\`" >> $GITHUB_STEP_SUMMARY

      # ── 6.6) حارس توافق الإصدارات ──
      # تعارض cordova/minSdk أوقف البناء مرّتين، وكان يظهر بعد 25 ثانية
      # داخل أثر Gradle طويل. هنا يُكتشف في ثانيتين برسالة مباشرة.
      - name: Verify SDK versions
        run: |
          set -euo pipefail
          V=android/variables.gradle
          num () { grep -oE "$1[[:space:]]*=[[:space:]]*[0-9]+" "$V" | head -1 | grep -oE '[0-9]+$'; }
          MIN=$(num minSdkVersion)
          TGT=$(num targetSdkVersion)
          CDV=$(grep -oE "cordovaAndroidVersion[[:space:]]*=[[:space:]]*'[^']+'" "$V" \
                | head -1 | grep -oE "[0-9][0-9.]*")
          echo "minSdk=$MIN  targetSdk=$TGT  cordovaAndroid=$CDV"

          if [ "$MIN" -lt 24 ]; then
            echo "::error::minSdkVersion=$MIN — تشترط ميزة «الحماية التلقائية» في Google Play الإصدار 24 كحدّ أدنى. ارفعه في android/variables.gradle."
            exit 1
          fi
          if [ "${CDV%%.*}" -ge 12 ] && [ "$MIN" -lt 24 ]; then
            echo "::error::تعارض: cordova-android $CDV يُعلن minSdk 24 بينما minSdkVersion=$MIN. أعد cordovaAndroidVersion إلى '10.1.1' في android/variables.gradle — المشروع لا يستعمل أي إضافة cordova."
            exit 1
          fi
          if [ "$TGT" -lt 36 ]; then
            echo "::error::targetSdkVersion=$TGT — تشترط Google Play 36 على الأقل."
            exit 1
          fi
          echo "✅ الإصدارات متوافقة"
          echo "### ✅ minSdk \`$MIN\` · targetSdk \`$TGT\` · cordova \`$CDV\`" >> $GITHUB_STEP_SUMMARY

      # ── 7) Gradle 8.11.1 ──
      # الـ runner يحمل Gradle 9.x، و AGP 8.9.1 لا يدعم Gradle 9، كما أنّ
      # `gradle wrapper` تحت Gradle 9 تتعارض مع distributionUrl المثبَّت
      # فتفشل بـ «Task :wrapper FAILED». ننزّل 8.11.1 مباشرةً ونضعه أول
      # المسار، فيولّد الـ wrapper بنفس إصداره.
      - name: Setup Gradle 8.11.1
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          rm -rf "$HOME/gradle-dist"
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Show Gradle version
        run: gradle --version

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.11.1

      # ── 8) Decode the release keystore from a base64 secret ──
      - name: Decode keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          HAS_KEYSTORE: ${{ secrets.DECIPHER_KEYSTORE_BASE64 != '' }}
          KS_B64: ${{ secrets.DECIPHER_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.DECIPHER_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.DECIPHER_KEY_ALIAS }}
        run: |
          # نظّف أي مسافات/أسطر جديدة تسلّلت أثناء النسخ من الهاتف
          printf '%s' "$KS_B64" | tr -d ' \n\r\t' | base64 -d > android/app/release.keystore || {
            echo "::error::فشل فك Base64 — السر DECIPHER_KEYSTORE_BASE64 تالف. أعد نسخه كاملاً."
            exit 1
          }
          SIZE=$(wc -c < android/app/release.keystore)
          echo "Keystore decoded: ${SIZE} bytes"
          if [ "$SIZE" -lt 500 ]; then
            echo "::error::ملف المفتاح صغير جداً (${SIZE} بايت) — السر منسوخ ناقصاً. أعد نسخ keystore.base64.txt كاملاً."
            exit 1
          fi
          # ✅ تحقّق فوري من سلامة المفتاح وكلمة المرور والـ alias
          keytool -list -keystore android/app/release.keystore \
            -storepass "$KS_PASS" -alias "$KS_ALIAS" >/dev/null 2>&1 || {
            echo "::error::المفتاح تالف أو كلمة المرور/alias خاطئة. تحقق من الأسرار الأربعة."
            keytool -list -keystore android/app/release.keystore -storepass "$KS_PASS" 2>&1 | head -5 || true
            exit 1
          }
          echo "✅ Keystore verified successfully (alias: $KS_ALIAS)"

      # Re-evaluate the keystore flag for later steps
      - name: Detect keystore
        id: keystore
        run: |
          if [ -n "${{ secrets.DECIPHER_KEYSTORE_BASE64 }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 9a) Build SIGNED AAB + APK (when secrets are configured) ──
      - name: Build signed AAB and APK
        if: steps.keystore.outputs.present == 'true'
        working-directory: android
        env:
          DECIPHER_KEYSTORE_PATH: release.keystore
          DECIPHER_KEYSTORE_PASSWORD: ${{ secrets.DECIPHER_KEYSTORE_PASSWORD }}
          DECIPHER_KEY_ALIAS: ${{ secrets.DECIPHER_KEY_ALIAS }}
          DECIPHER_KEY_PASSWORD: ${{ secrets.DECIPHER_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      # ── 9b) Build UNSIGNED debug APK (fallback when no keystore yet) ──
      - name: Build debug APK (no keystore configured)
        if: steps.keystore.outputs.present == 'false'
        working-directory: android
        run: |
          echo "::warning::No keystore secret found — building a DEBUG APK only. Add DECIPHER_KEYSTORE_BASE64 to build a signed AAB for Google Play."
          ./gradlew assembleDebug --no-daemon --stacktrace

      # ── 10) Upload artifacts ──
      - name: Upload AAB
        if: steps.keystore.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: decipher-tahiro-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload release APK
        if: steps.keystore.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: decipher-tahiro-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload debug APK
        if: steps.keystore.outputs.present == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: decipher-tahiro-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
